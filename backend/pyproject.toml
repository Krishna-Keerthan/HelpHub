[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krishna-Keerthan", email = "krishnakeerthan828@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "sqlalchemy[asyncio]>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
# Local embedding model (fastembed + onnxruntime): dev, tests and eval only.
# Production embeds on Cloudflare and installs with --no-dev.
local-embeddings = ["fastembed>=0.9.0"]
dev = [
    {include-group = "local-embeddings"},
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not slow'"
markers = ["slow: loads the real embedding model; run with -m slow"]
log_level = "INFO"

[tool.ruff.lint]
extend-select = ["S", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Existing tests are not edited; their fixed-SQL f-strings and subprocess calls
# (argument lists, no shell) are accepted per file.
"tests/core/test_hygiene_static.py" = ["S603"]
"tests/documents/test_documents_schema.py" = ["S608"]
"tests/isolation/test_documents_chunks_rls.py" = ["S608"]
"tests/tooling/test_gate_checks.py" = ["S603", "S607"]  # git with argument lists, no shell
"tests/chat/test_chat_service.py" = ["ASYNC110"]
"tests/migrations/test_migration_roundtrip.py" = ["S603"]
"tests/tooling/test_guard_bash.py" = ["S603"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api does not use the database driver directly"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["sqlalchemy", "asyncpg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services do not use the database driver directly"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["sqlalchemy", "asyncpg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services do not import fastapi"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "db does not import api or services"
type = "forbidden"
source_modules = ["app.db"]
forbidden_modules = ["app.api", "app.services"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core does not import db, services or api"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.db", "app.services", "app.api"]
allow_indirect_imports = true

# TODO: when app.workers and app.rag exist, add a contract that they import
# only app.services (import-linter cannot reference modules that do not exist).
