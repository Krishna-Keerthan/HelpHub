name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"

jobs:
  gate:
    name: gate --full (pgvector + tsvector, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # The container's bootstrap user is the migration owner; it is never
          # named postgres (see docs/deploy/runbook.md).
          POSTGRES_USER: helphub_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: helphub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helphub_owner -d helphub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci-owner-password
      POSTGRES_USER: helphub_owner
      POSTGRES_DB: helphub
      APP_DB_PASSWORD: ci-app-password
      DATABASE_URL: postgresql+asyncpg://helphub_app:ci-app-password@localhost:5432/helphub
      MIGRATION_DATABASE_URL: postgresql+asyncpg://helphub_owner:ci-owner-password@localhost:5432/helphub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Generate a throwaway JWT secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create the app role (same script as docker compose)
        run: bash docker/postgres/init/01-roles.sh
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Migrate as the owner role
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Gate (full)
        run: scripts/gate.sh --full

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: pip-audit, production dependencies (fails on any known vulnerability)
        working-directory: backend
        run: |
          uv sync --frozen
          bash ../scripts/audit_deps.sh prod
      - name: pip-audit, full environment incl. dev (warnings only, never fails)
        working-directory: backend
        run: bash ../scripts/audit_deps.sh full

  image:
    name: image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t helphub-backend:ci backend
      - name: Image imports the app and has no local embedding stack
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://x:y@localhost/x \
            -e JWT_SECRET=fake-ci-placeholder-jwt-secret-000000000000000000 \
            -e CLOUDFLARE_ACCOUNT_ID=ci-placeholder \
            -e CLOUDFLARE_API_TOKEN=ci-placeholder \
            helphub-backend:ci python -c "
          import sys, importlib.util
          import app.main
          from app.services.embeddings import default_provider
          assert type(default_provider()).__name__ == 'CloudflareEmbeddingProvider'
          for name in ('fastembed', 'onnxruntime'):
              assert name not in sys.modules, name + ' imported'
              assert importlib.util.find_spec(name) is None, name + ' installed in the image'
          print('ok')"

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CLI is MIT licensed; the gitleaks-action wrapper is not used (it needs a
      # licence key for organization accounts).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all history
        run: ./gitleaks detect --source . --log-opts="--all" --redact --no-banner
