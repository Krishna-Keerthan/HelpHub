name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/api/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "docs/api/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://backend.invalid
